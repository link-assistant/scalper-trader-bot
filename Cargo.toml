[package]
name = "scalper-trader-bot"
version = "0.1.0"
edition = "2021"
description = "A Rust-based scalping trader bot with multi-exchange support, market simulator, and comprehensive testing"
readme = "README.md"
license = "Unlicense"
keywords = ["trading", "scalping", "bot", "crypto", "exchange"]
categories = ["finance", "simulation"]
repository = "https://github.com/link-assistant/scalper-trader-bot"
documentation = "https://github.com/link-assistant/scalper-trader-bot"
rust-version = "1.70"

[lib]
name = "scalper_trader_bot"
path = "src/lib.rs"

[[bin]]
name = "scalper-trader-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
